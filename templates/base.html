<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SGE - Sistema Gerenciador de Estoque{% endblock %}</title>

    <!-- Duralux CSS Dependencies (Caminhos simplificados) -->
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="stylesheet" type="text/css" href="css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="css/vendors.min.css">
    <link rel="stylesheet" type="text/css" href="css/daterangepicker.min.css">
    <link rel="stylesheet" type="text/css" href="css/theme.min.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- ============================================================ -->
    <!-- Navigation (Sidebar) -->
    <!-- ============================================================ -->
    <nav class="nxl-navigation">
        <div class="navbar-wrapper">
            <div class="m-header">
                <a href="/" class="b-brand">
                    <img src="images/logo-full.png" alt="Logo" class="logo logo-lg">
                    <img src="images/logo-abbr.png" alt="Logo" class="logo logo-sm">
                </a>
            </div>
            <div class="navbar-content">
                <ul class="nxl-navbar">
                    <li class="nxl-item nxl-caption">
                        <label>Navegação Principal</label>
                    </li>
                    <li class="nxl-item">
                        <a href="#" class="nxl-link">
                            <span class="nxl-micon"><i class="feather-layout"></i></span>
                            <span class="nxl-mtext">Dashboard</span>
                        </a>
                    </li>
                    <li class="nxl-item">
                        <a href="#" class="nxl-link">
                            <span class="nxl-micon"><i class="feather-box"></i></span>
                            <span class="nxl-mtext">Estoque & Produtos</span>
                        </a>
                    </li>
                    <li class="nxl-item">
                        <a href="#" class="nxl-link">
                            <span class="nxl-micon"><i class="feather-database"></i></span>
                            <span class="nxl-mtext">Cálculos & Fichas</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- ============================================================ -->
    <!-- Top Header -->
    <!-- ============================================================ -->
    <header class="nxl-header">
        <div class="header-wrapper">
            <div class="header-left d-flex align-items-center gap-4">
                <a href="javascript:void(0);" class="nxl-head-mobile-toggler" id="mobile-collapse">
                    <div class="hamburger hamburger--arrowturn">
                        <div class="hamburger-box">
                            <div class="hamburger-inner"></div>
                        </div>
                    </div>
                </a>
                <div class="nxl-navigation-toggle">
                    <a href="javascript:void(0);" id="menu-mini-button">
                        <i class="feather-align-left"></i>
                    </a>
                    <a href="javascript:void(0);" id="menu-expend-button" style="display: none">
                        <i class="feather-arrow-right"></i>
                    </a>
                </div>
            </div>
            <div class="header-right ms-auto">
                <div class="d-flex align-items-center">
                    <div class="nxl-h-item dark-light-theme">
                        <a href="javascript:void(0);" class="nxl-head-link me-0 dark-button">
                            <i class="feather-moon"></i>
                        </a>
                        <a href="javascript:void(0);" class="nxl-head-link me-0 light-button" style="display: none">
                            <i class="feather-sun"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- ============================================================ -->
    <!-- Main Content Shell -->
    <!-- ============================================================ -->
    <main class="nxl-container">
        <div class="nxl-content">
            
            <!-- Page Header / Breadcrumb -->
            <div class="page-header">
                <div class="page-header-left d-flex align-items-center">
                    <div class="page-header-title">
                        <h5 class="m-b-10">{% block page_title %}Visão Geral{% endblock %}</h5>
                    </div>
                    <ul class="breadcrumb">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item">{% block breadcrumb_active %}Dashboard{% endblock %}</li>
                    </ul>
                </div>
            </div>

            <!-- Content Body -->
            <div class="main-content">
                {% block content %}
                <!-- Seu conteúdo específico entra aqui -->
                {% endblock %}
            </div>

        </div>
    </main>

    <!-- Scripts do Duralux (Caminhos simplificados) -->
    <script src="js/vendors.min.js"></script>
    <script src="js/common-init.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
