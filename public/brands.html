<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClothStock - Gestão de Marcas</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- Estilos de Layout (Claro / Escuro) -->
    <style>
        :root {
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --text-color: #212529;
            --border-color: #e2e8f0;
            --sidebar-bg: #1e293b;
        }

        body.dark-mode {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --sidebar-bg: #0b0f19;
        }

        body { 
            display: flex; 
            min-height: 100vh; 
            background-color: var(--bg-body); 
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .nxl-navigation { 
            width: 260px; 
            background: var(--sidebar-bg); 
            color: #fff; 
            flex-shrink: 0; 
            min-height: 100vh; 
            padding: 20px; 
            transition: background-color 0.3s;
        }

        .nxl-navigation a { 
            color: #94a3b8; 
            text-decoration: none; 
            padding: 10px 12px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            border-radius: 6px; 
        }

        .nxl-navigation a:hover, .nxl-navigation a.active { 
            color: #fff; 
            background: rgba(255,255,255,0.08); 
        }

        .nxl-container { flex-grow: 1; padding: 25px; }

        .nxl-header, .card { 
            background: var(--bg-card) !important; 
            color: var(--text-color) !important;
            border-color: var(--border-color) !important; 
            transition: background-color 0.3s;
        }

        .table {
            color: var(--text-color) !important;
        }

        body.dark-mode .table-light {
            background-color: #334155 !important;
            color: #f8fafc !important;
        }

        body.dark-mode .modal-content {
            background-color: #1e293b;
            color: #f8fafc;
            border-color: #334155;
        }

        body.dark-mode .form-control, body.dark-mode .form-select {
            background-color: #0f172a;
            color: #f8fafc;
            border-color: #334155;
        }
    </style>
</head>
<body>

    <!-- Sidebar / Menu de Navegação -->
    <nav class="nxl-navigation">
        <div class="m-header mb-4">
            <h4 class="text-white fw-bold mb-0">ClothStock</h4>
        </div>
        <ul class="nav flex-column gap-1">
            <li class="nav-item">
                <a href="/index.html"><i data-feather="layout"></i> <span>Dashboard</span></a>
            </li>
            <li class="nav-item">
                <a href="/categories.html"><i data-feather="folder"></i> <span>Categorias</span></a>
            </li>
            <li class="nav-item">
                <a href="/brands.html" class="active"><i data-feather="tag"></i> <span>Marcas</span></a>
            </li>
            <li class="nav-item">
                <a href="/products.html"><i data-feather="box"></i> <span>Produtos</span></a>
            </li>
            <li class="nav-item">
                <a href="#"><i data-feather="database"></i> <span>Cálculos & Fichas</span></a>
            </li>
        </ul>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="nxl-container">
        <!-- Cabeçalho do Topo com Alternador Dark Mode -->
        <header class="nxl-header d-flex justify-content-between align-items-center shadow-sm p-3 mb-4 rounded">
            <div>
                <h5 class="mb-0 fw-bold">Gestão de Marcas</h5>
                <small class="text-muted">Cadastro e controle de marcas de produtos</small>
            </div>
            <button id="theme-toggle" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2" onclick="toggleDarkMode()">
                <i data-feather="moon" id="theme-icon"></i> <span id="theme-text">Modo Escuro</span>
            </button>
        </header>

        <!-- Corpo da Página -->
        <div class="main-content">
            <div id="alert-container"></div>

            <div class="card shadow-sm border">
                <div class="card-header bg-transparent d-flex justify-content-between align-items-center py-3">
                    <h5 class="card-title mb-0 fw-bold">Marcas Cadastradas</h5>
                    <button type="button" class="btn btn-primary btn-sm d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#modalCreateBrand">
                        <i data-feather="plus"></i> Nova Marca
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nome da Marca</th>
                                    <th class="text-end">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="brands-table-body">
                                <tr>
                                    <td colspan="3" class="text-center text-muted py-4">Carregando marcas...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Criar Marca -->
    <div class="modal fade" id="modalCreateBrand" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Nova Marca</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-create-brand">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nome da Marca</label>
                            <input type="text" class="form-control" id="create-brand-name" placeholder="Ex: Nike, Adidas, Zara" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Marca</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Editar Marca -->
    <div class="modal fade" id="modalEditBrand" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Editar Marca</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-edit-brand">
                    <input type="hidden" id="edit-brand-id">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nome da Marca</label>
                            <input type="text" class="form-control" id="edit-brand-name" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Atualizar Marca</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts Bootstrap e Feather Icons -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 1. Inicialização de Ícones
        feather.replace();

        // 2. Lógica do Modo Escuro (Dark Mode)
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            
            document.getElementById('theme-text').innerText = isDark ? 'Modo Claro' : 'Modo Escuro';
            
            const themeIcon = document.getElementById('theme-icon');
            themeIcon.setAttribute('data-feather', isDark ? 'sun' : 'moon');
            feather.replace();
        }

        // 3. API URL
        const BRANDS_API_URL = '/api/brands';

        function showAlert(message, type = 'success') {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        // Carregar Tabela de Marcas
        async function fetchBrands() {
            try {
                const response = await fetch(BRANDS_API_URL);
                const result = await response.json();
                
                const brandsList = Array.isArray(result) ? result : (result.data || result.brands || []);

                const tbody = document.getElementById('brands-table-body');
                tbody.innerHTML = '';

                if (!brandsList || brandsList.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-4">Nenhuma marca cadastrada.</td></tr>';
                    return;
                }

                brandsList.forEach(brand => {
                    const id = brand.id;
                    const name = brand.name || brand.nome || 'Sem nome';

                    tbody.innerHTML += `
                        <tr>
                            <td>${id}</td>
                            <td class="fw-bold">${name}</td>
                            <td class="text-end">
                                <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${id}, '${name}')">Editar</button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteBrand(${id})">Excluir</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Erro ao buscar marcas:", error);
                document.getElementById('brands-table-body').innerHTML = '<tr><td colspan="3" class="text-center text-danger py-4">Erro ao conectar com a API de marcas.</td></tr>';
            }
        }

        // Criar Marca
        document.getElementById('form-create-brand').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('create-brand-name').value
            };

            try {
                const response = await fetch(BRANDS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    showAlert('Marca criada com sucesso!');
                    bootstrap.Modal.getInstance(document.getElementById('modalCreateBrand')).hide();
                    document.getElementById('form-create-brand').reset();
                    fetchBrands();
                } else {
                    showAlert('Erro ao criar marca.', 'danger');
                }
            } catch (err) {
                showAlert('Erro ao conectar ao servidor.', 'danger');
            }
        });

        // Abrir Modal de Edição
        window.openEditModal = function(id, name) {
            document.getElementById('edit-brand-id').value = id;
            document.getElementById('edit-brand-name').value = name;
            
            new bootstrap.Modal(document.getElementById('modalEditBrand')).show();
        };

        // Editar Marca
        document.getElementById('form-edit-brand').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-brand-id').value;
            const payload = {
                name: document.getElementById('edit-brand-name').value
            };

            try {
                const response = await fetch(`${BRANDS_API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    showAlert('Marca atualizada com sucesso!');
                    bootstrap.Modal.getInstance(document.getElementById('modalEditBrand')).hide();
                    fetchBrands();
                } else {
                    showAlert('Erro ao atualizar marca.', 'danger');
                }
            } catch (err) {
                showAlert('Erro ao conectar ao servidor.', 'danger');
            }
        });

        // Excluir Marca
        window.deleteBrand = async function(id) {
            if (!confirm('Deseja realmente excluir esta marca?')) return;

            try {
                const response = await fetch(`${BRANDS_API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showAlert('Marca excluída com sucesso!');
                    fetchBrands();
                } else {
                    showAlert('Erro ao excluir marca.', 'danger');
                }
            } catch (err) {
                showAlert('Erro de conexão.', 'danger');
            }
        };

        // Carregar dados iniciais
        document.addEventListener('DOMContentLoaded', () => {
            fetchBrands();
        });
    </script>
</body>
</html>
