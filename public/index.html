<!DOCTYPE html>

<html lang="pt-BR">
    
<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>window.location.replace('/dashboard.html');</script>

    <title>
        ClothStock - Dashboard
    </title>

    <!-- ============================================================
         BOOTSTRAP
    ============================================================ -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ============================================================
         FEATHER ICONS
    ============================================================ -->

    <script src="https://unpkg.com/feather-icons"></script>


    <style>
        :root {

            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --text-color: #212529;
            --border-color: #e2e8f0;
            --sidebar-bg: #1e293b;

        }


        body.dark-mode {

            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --sidebar-bg: #0b0f19;

        }


        body {

            display: flex;

            min-height: 100vh;

            margin: 0;

            background-color: var(--bg-body);

            color: var(--text-color);

        }


        /* ============================================================
           SIDEBAR
        ============================================================ */

        .nxl-navigation {

            width: 260px;

            background: var(--sidebar-bg);

            color: #fff;

            flex-shrink: 0;

            min-height: 100vh;

            padding: 20px;

        }


        .nxl-navigation a {

            color: #94a3b8;

            text-decoration: none;

            padding: 10px 12px;

            display: flex;

            align-items: center;

            gap: 10px;

            border-radius: 6px;

        }


        .nxl-navigation a:hover,
        .nxl-navigation a.active {

            color: #fff;

            background: rgba(255, 255, 255, 0.08);

        }


        .nxl-navigation svg {

            width: 18px;

            height: 18px;

        }


        /* ============================================================
           CONTEÚDO
        ============================================================ */

        .nxl-container {

            flex-grow: 1;

            padding: 25px;

            overflow-x: hidden;

        }


        .nxl-header,
        .card {

            background: var(--bg-card) !important;

            color: var(--text-color) !important;

            border-color: var(--border-color) !important;

        }


        .stat-card {

            border-radius: 10px;

            padding: 25px;

        }


        .stat-icon {

            width: 45px;

            height: 45px;

            border-radius: 8px;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        @media (max-width: 768px) {

            .nxl-navigation {

                width: 210px;

            }

            .nxl-container {

                padding: 15px;

            }

        }
    </style>

<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/rbac.css">
<script src="/js/sidebar.js" defer></script>

    <script src="/js/rbac.js" defer></script>

    <script src="/js/app-shell.js" defer></script>
</head>


<body>


    <!-- ============================================================
         SIDEBAR
    ============================================================ -->

    <nav class="nxl-navigation">

        <div class="m-header mb-4">

            <h4 class="text-white fw-bold mb-0">
                ClothStock
            </h4>

        </div>


        <ul class="nav flex-column gap-1">


            <!-- DASHBOARD -->

            <li class="nav-item">

                <a href="/dashboard.html" class="active">

                    <i data-feather="layout"></i>

                    <span>
                        Dashboard
                    </span>

                </a>

            </li>


            <!-- CATEGORIAS -->

            <li class="nav-item">

                <a href="/categories.html">

                    <i data-feather="folder"></i>

                    <span>
                        Categorias
                    </span>

                </a>

            </li>


            <!-- MARCAS -->

            <li class="nav-item">

                <a href="/brands.html">

                    <i data-feather="tag"></i>

                    <span>
                        Marcas
                    </span>

                </a>

            </li>


            <!-- PRODUTOS -->

            <li class="nav-item">

                <a href="/products.html">

                    <i data-feather="box"></i>

                    <span>
                        Produtos
                    </span>

                </a>

            </li>


            <!-- FORNECEDORES -->

            <li class="nav-item">

                <a href="/suppliers.html">

                    <i data-feather="truck"></i>

                    <span>
                        Fornecedores
                    </span>

                </a>

            </li>


        </ul>

    </nav>


    <!-- ============================================================
         CONTEÚDO PRINCIPAL
    ============================================================ -->

    <main class="nxl-container">


        <!-- HEADER -->

        <header class="nxl-header d-flex justify-content-between align-items-center shadow-sm p-3 mb-4 rounded">

            <div>

                <h5 class="mb-0 fw-bold">
                    Dashboard
                </h5>

                <small class="text-muted">
                    Visão geral do ClothStock
                </small>

            </div>


            <button id="theme-toggle" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2"
                onclick="toggleDarkMode()">

                <i data-feather="moon" id="theme-icon"></i>

                <span id="theme-text">
                    Modo Escuro
                </span>

            </button>

        </header>


        <!-- ========================================================
             CARDS
        ======================================================== -->

        <div class="row g-4">


            <!-- CATEGORIAS -->

            <div class="col-md-6 col-xl-3">

                <div class="card shadow-sm stat-card h-100">

                    <div class="stat-icon bg-primary bg-opacity-10 text-primary mb-3">

                        <i data-feather="folder"></i>

                    </div>


                    <h6 class="text-muted">
                        Categorias
                    </h6>


                    <h3 class="fw-bold">
                        -
                    </h3>


                    <a href="/categories.html" class="btn btn-sm btn-outline-primary">
                        Gerenciar
                    </a>

                </div>

            </div>


            <!-- MARCAS -->

            <div class="col-md-6 col-xl-3">

                <div class="card shadow-sm stat-card h-100">

                    <div class="stat-icon bg-success bg-opacity-10 text-success mb-3">

                        <i data-feather="tag"></i>

                    </div>


                    <h6 class="text-muted">
                        Marcas
                    </h6>


                    <h3 class="fw-bold">
                        -
                    </h3>


                    <a href="/brands.html" class="btn btn-sm btn-outline-success">
                        Gerenciar
                    </a>

                </div>

            </div>


            <!-- PRODUTOS -->

            <div class="col-md-6 col-xl-3">

                <div class="card shadow-sm stat-card h-100">

                    <div class="stat-icon bg-warning bg-opacity-10 text-warning mb-3">

                        <i data-feather="box"></i>

                    </div>


                    <h6 class="text-muted">
                        Produtos
                    </h6>


                    <h3 class="fw-bold">
                        -
                    </h3>


                    <a href="/products.html" class="btn btn-sm btn-outline-warning">
                        Gerenciar
                    </a>

                </div>

            </div>


            <!-- FORNECEDORES -->

            <div class="col-md-6 col-xl-3">

                <div class="card shadow-sm stat-card h-100">

                    <div class="stat-icon bg-info bg-opacity-10 text-info mb-3">

                        <i data-feather="truck"></i>

                    </div>


                    <h6 class="text-muted">
                        Fornecedores
                    </h6>


                    <h3 class="fw-bold">
                        -
                    </h3>


                    <a href="/suppliers.html" class="btn btn-sm btn-outline-info">
                        Gerenciar
                    </a>

                </div>

            </div>


        </div>


        <!-- ========================================================
             STATUS DA API
        ======================================================== -->

        <div class="card shadow-sm mt-4">

            <div class="card-body">

                <h5 class="fw-bold">
                    Status do sistema
                </h5>

                <p class="text-success mb-0">
                    🟢 Servidor e API operando normalmente.
                </p>

            </div>

        </div>


    </main>


    <!-- ============================================================
         JAVASCRIPT
    ============================================================ -->

    <script>

        function refreshIcons() {

            if (typeof feather !== 'undefined') {

                feather.replace();

            }

        }


        function toggleDarkMode() {

            document.body.classList.toggle(
                'dark-mode'
            );


            const isDark =
                document.body.classList.contains(
                    'dark-mode'
                );


            document.getElementById(
                'theme-text'
            ).innerText =
                isDark
                    ? 'Modo Claro'
                    : 'Modo Escuro';


            const themeIcon =
                document.getElementById(
                    'theme-icon'
                );


            themeIcon.setAttribute(
                'data-feather',
                isDark
                    ? 'sun'
                    : 'moon'
            );


            refreshIcons();

        }


        document.addEventListener(
            'DOMContentLoaded',
            function () {

                refreshIcons();

            }
        );

    </script>


</body>

</html>
