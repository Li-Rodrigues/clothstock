    <link rel="stylesheet" type="text/css" href="css/vendors.min.css">
    <link rel="stylesheet" type="text/css" href="css/theme.min.css">
</head>
<body>

            </div>
            <div class="navbar-content">
                <ul class="nxl-navbar">
                    <li class="nxl-item nxl-caption">
                        <label>Navegação Principal</label>
                    </li>
                    <li class="nxl-item">
                        <a href="/" class="nxl-link">
                            <span class="nxl-micon"><i class="feather-layout"></i></span>
                            <span class="nxl-mtext">Dashboard</span>
                        </a>
                    </li>
                    
                    <li class="nxl-item nxl-caption">
                        <label>Cadastros Base</label>
                    </li>
                    <li class="nxl-item">
                        <a href="/brands.html" class="nxl-link">
                            <span class="nxl-micon"><i class="feather-tag"></i></span>
                            <span class="nxl-mtext">Marcas</span>
                        </a>
                    </li>
                    <li class="nxl-item active">
                        <a href="/categories.html" class="nxl-link">
                            <span class="nxl-micon"><i class="feather-grid"></i></span>
                            <span class="nxl-mtext">Categorias</span>
                        </a>
                    </li>
                    <li class="nxl-item">
                        <a href="/products.html" class="nxl-link">
                            <span class="nxl-micon"><i class="feather-box"></i></span>

                        </a>
                    </li>

                    <li class="nxl-item nxl-caption">
                        <label>Movimentações</label>
                    </li>
                    <li class="nxl-item">
                        <a href="/inflows.html" class="nxl-link">
                            <span class="nxl-micon"><i class="feather-arrow-down-left"></i></span>
                            <span class="nxl-mtext">Entradas (Inflow)</span>

    <!-- ============================================================ -->
    <!-- Top Header -->
    <!-- ============================================================ -->
    <header class="nxl-header">
        <div class="header-wrapper">
            <div class="header-left d-flex align-items-center gap-4">
                <a href="javascript:void(0);" class="nxl-head-mobile-toggler" id="mobile-collapse">
                    <div class="hamburger hamburger--arrowturn">
                        <div class="hamburger-box">
                            <div class="hamburger-inner"></div>
                        </div>
                    </div>
                </a>
                <div class="nxl-navigation-toggle">
                    <a href="javascript:void(0);" id="menu-mini-button">
                        <i class="feather-align-left"></i>
                    </a>
                    <a href="javascript:void(0);" id="menu-expend-button" style="display: none">
                        <i class="feather-arrow-right"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- ============================================================ -->
    <!-- Main Content -->
    <!-- ============================================================ -->
    <main class="nxl-container">
        <div class="nxl-content">
            
            <!-- Page Header -->
            <div class="page-header">
                <div class="page-header-left d-flex align-items-center justify-content-between w-100 me-3">
                    <div>
                        <h5 class="m-b-10">Gerenciamento de Categorias</h5>
                        <ul class="breadcrumb">
                            <li class="breadcrumb-item"><a href="/">Home</a></li>
                            <li class="breadcrumb-item active">Categorias</li>
                        </ul>
                    </div>
                    <!-- Botão do Modal -->
                    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAddCategory">
                        <i class="feather-plus me-1"></i> Nova Categoria
                    </button>
                </div>
            </div>

            <!-- Content Body -->
            <div class="main-content">
                <div id="alert-container"></div>

                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="card-title m-0">Categorias Cadastradas</h5>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Nome da Categoria</th>
                                        <th>Descrição</th>
                                        <th>Data de Cadastro</th>
                                    </tr>
                                </thead>
                                <tbody id="categories-table-body">
                                    <tr>
                                        <td colspan="4" class="text-center py-4 text-muted">Carregando categorias...</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- ============================================================ -->
    <!-- Modal: Cadastrar Nova Categoria -->
    <!-- ============================================================ -->
    <div class="modal fade" id="modalAddCategory" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cadastrar Nova Categoria</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <form id="form-add-category">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label for="category-name" class="form-label">Nome da Categoria <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="category-name" required placeholder="Ex: Camisetas, Calças, Acessórios">
                        </div>
                        <div class="mb-3">
                            <label for="category-description" class="form-label">Descrição</label>
                            <textarea class="form-control" id="category-description" rows="3" placeholder="Descrição opcional da categoria"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btn-save-category">Salvar Categoria</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts do Duralux e Lógica de Integração -->
    <script src="js/vendors.min.js"></script>
    <script src="js/common-init.min.js"></script>
    
    <script>
        // 1. Carregar Categorias da API
        async function fetchAndRenderCategories() {
            const tbody = document.getElementById('categories-table-body');

            try {
                const response = await fetch('/api/categories');
                const result = await response.json();

                if (!result.success || !result.data || result.data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="text-center py-4 text-muted">Nenhuma categoria cadastrada no banco.</td>
                        </tr>`;
                    return;
                }

                tbody.innerHTML = result.data.map(category => `
                    <tr>
                        <td><strong>#${category.id}</strong></td>
                        <td class="fw-semibold text-primary">${category.name}</td>
                        <td>${category.description || '<span class="text-muted">Sem descrição</span>'}</td>
                        <td>${category.created_at ? new Date(category.created_at).toLocaleDateString('pt-BR') : '-'}</td>
                    </tr>
                `).join('');

            } catch (error) {
                console.error('Erro ao carregar categorias:', error);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center py-4 text-danger">Erro ao conectar com a API.</td>
                    </tr>`;
            }
        }

        // 2. Cadastrar Categoria via POST
        document.getElementById('form-add-category').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('category-name').value.trim();
            const description = document.getElementById('category-description').value.trim();
            const btnSave = document.getElementById('btn-save-category');

            btnSave.disabled = true;
            btnSave.textContent = 'Salvando...';

            try {
                const response = await fetch('/api/categories', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, description })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    document.getElementById('form-add-category').reset();

                    const modalElement = document.getElementById('modalAddCategory');
                    const modalInstance = bootstrap.Modal.getInstance(modalElement) || new bootstrap.Modal(modalElement);
                    modalInstance.hide();

                    showAlert('Categoria cadastrada com sucesso!', 'success');
                    fetchAndRenderCategories();
                } else {
                    showAlert(result.error || 'Erro ao cadastrar categoria.', 'danger');
                }
            } catch (error) {
                showAlert('Erro de conexão com o servidor.', 'danger');
            } finally {
                btnSave.disabled = false;
                btnSave.textContent = 'Salvar Categoria';
            }
        });

        function showAlert(message, type) {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show mb-4" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>`;
            setTimeout(() => { container.innerHTML = ''; }, 4000);
        }

        document.addEventListener('DOMContentLoaded', fetchAndRenderCategories);
    </script>
</body>
</html>
