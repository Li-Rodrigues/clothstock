<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acessar | ClothStock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="/css/sidebar.css">
  <style>
    :root { --login-bg: #f8f9fa; --login-card: #fff; --login-text: #212529; --login-border: #e2e8f0; }
    body.dark-mode { --login-bg: #0f172a; --login-card: #1e293b; --login-text: #f8fafc; --login-border: #334155; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: var(--login-bg); color: var(--login-text); transition: background-color .3s, color .3s; }
    .login-shell { width: min(100%, 420px); }
    .login-brand { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; color: var(--login-text); text-decoration: none; }
    .login-brand i { width: 30px; height: 30px; color: #0d6efd; }
    .login-brand strong { font-size: 1.45rem; }
    .login-card { background: var(--login-card); color: var(--login-text); border: 1px solid var(--login-border); border-radius: 12px; box-shadow: 0 12px 30px rgba(15, 23, 42, .12); }
    .login-card .form-control { background: var(--login-card); color: var(--login-text); border-color: var(--login-border); }
    .login-card .form-control:focus { background: var(--login-card); color: var(--login-text); }
    .login-card .text-muted { color: #64748b !important; }
    body.dark-mode .login-card .text-muted { color: #94a3b8 !important; }
    .login-footer { margin-top: 18px; color: #64748b; font-size: .8rem; text-align: center; }
    body.dark-mode .login-footer { color: #94a3b8; }
    .auth-alt { margin: 1.25rem 0 0; text-align: center; font-size: .9rem; color: #64748b; }
    body.dark-mode .auth-alt { color: #94a3b8; }
    .auth-alt a { color: #0d6efd; font-weight: 600; text-decoration: none; }
    .auth-alt a:hover, .auth-alt a:focus-visible { text-decoration: underline; }
    body.dark-mode .auth-alt a { color: #7db3ff; }
  </style>
</head>
<body>
  <main class="login-shell">
    <a class="login-brand" href="/login.html" aria-label="ClothStock, página de acesso">
      <i data-feather="package" aria-hidden="true"></i>
      <strong>ClothStock</strong>
    </a>

    <section class="card login-card" aria-labelledby="login-title">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <h1 id="login-title" class="h4 fw-bold mb-2">Acesse sua conta</h1>
          <p class="text-muted mb-0">Gestão de estoque para a sua loja</p>
        </div>

        <div id="login-alert" class="alert alert-danger d-none" role="alert" aria-live="assertive"></div>

        <form id="login-form" novalidate>
          <div class="mb-3">
            <label class="form-label fw-semibold" for="login-email">E-mail</label>
            <input class="form-control" id="login-email" name="email" type="email" autocomplete="email" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold" for="login-password">Senha</label>
            <input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100 d-flex align-items-center justify-content-center gap-2" id="login-submit" type="submit">
            <i data-feather="log-in" aria-hidden="true"></i>
            <span>Entrar</span>
          </button>
        </form>

        <p class="auth-alt" id="register-hint">
          Ainda não possui uma conta? <a href="/register.html">Cadastre-se</a>
        </p>
      </div>
    </section>

    <p class="login-footer">© 2026 ClothStock -- Gestão de Estoque. Todos os direitos reservados.</p>
  </main>

  <script>
    const loginForm = document.getElementById('login-form');
    const loginAlert = document.getElementById('login-alert');
    const loginSubmit = document.getElementById('login-submit');

    function showLoginError(message) {
      loginAlert.textContent = message;
      loginAlert.classList.remove('d-none');
    }

    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      loginAlert.classList.add('d-none');
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!email || !password) {
        showLoginError('Informe e-mail e senha para continuar.');
        return;
      }

      loginSubmit.disabled = true;
      loginSubmit.querySelector('span').textContent = 'Entrando...';
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          credentials: 'include',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const result = await response.json();
        if (!response.ok) {
          const error = result.error || {};
          throw new Error(error.message || 'Não foi possível entrar.');
        }
        window.location.replace('/dashboard.html');
      } catch (error) {
        showLoginError(error.message || 'Não foi possível entrar. Tente novamente.');
        loginSubmit.disabled = false;
        loginSubmit.querySelector('span').textContent = 'Entrar';
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      if (window.feather) window.feather.replace();
      hideRegisterLinkWhenDisabled();
    });

    /*
     * O cadastro público é desligado em produção (ver register() em
     * src/controllers/authController.js). Quando isso acontece, o link
     * "Cadastre-se" é removido para não levar o visitante a uma página
     * que só pode recusar o pedido. A página /register.html continua
     * acessível e explica o motivo caso alguém digite a URL direto.
     *
     * Isto é apenas UX: quem bloqueia o cadastro é o backend, e não este
     * JavaScript.
     */
    function hideRegisterLinkWhenDisabled() {
      const hint = document.getElementById('register-hint');
      if (!hint) return;

      fetch('/api/auth/health', { headers: { Accept: 'application/json' } })
        .then(response => response.json())
        .then(result => {
          if (result && result.data && result.data.registrationEnabled === false) {
            hint.textContent = 'O cadastro público está desativado. Fale com o administrador para obter uma conta.';
          }
        })
        .catch(() => {
          // Falha de rede: mantém o link como está e deixa o backend decidir.
        });
    }
  </script>
</body>
</html>
