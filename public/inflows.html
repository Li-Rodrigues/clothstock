<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Entradas | ClothStock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="css/sidebar.css">
  <style>
    .nxl-container {
      padding: 25px
    }

    .card {
      border: 0;
      box-shadow: 0 1px 3px #00000014
    }

    .form-label {
      font-weight: 600
    }
  </style>
</head>

<body class="movement-page" data-movement-type="INFLOW">
  <main class="nxl-container">
    <header class="nxl-header d-flex justify-content-between align-items-center shadow-sm p-3 mb-4 rounded">
      <div>
        <h5 class="mb-0 fw-bold">Entradas de estoque</h5><small class="text-muted">Registro e controle das entradas de
          produtos.</small>
      </div><button id="theme-toggle" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2"
        type="button"><i id="theme-icon" data-feather="moon"></i><span id="theme-text">Modo Escuro</span></button>
    </header>
    <div id="alert-container"></div>
    <section class="card shadow-sm border mb-4">
      <div class="card-header bg-transparent d-flex justify-content-between align-items-center py-3">
        <h5 class="card-title mb-0 fw-bold">Entradas cadastradas</h5><button
          class="btn btn-primary btn-sm d-flex align-items-center gap-2" data-bs-toggle="modal"
          data-bs-target="#movement-modal"><i data-feather="plus"></i>Nova Entrada</button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th>ID</th>
                <th>Data/Hora</th>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Custo unitário</th>
                <th>Observação</th>
                <th class="text-center" style="width:190px">Ações</th>
              </tr>
            </thead>
            <tbody id="movements-body">
              <tr>
                <td colspan="7" class="text-center text-muted py-4">Carregando entradas...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <div class="modal fade" id="movement-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold">Nova Entrada</h5><button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form id="movement-form">
          <div class="modal-body">
            <div class="mb-3"><label class="form-label" for="product_id">Produto *</label><select class="form-select"
                id="product_id" required></select></div>
            <div class="mb-3"><label class="form-label" for="quantity">Quantidade *</label><input class="form-control"
                type="number" id="quantity" min="1" required></div>
            <div class="mb-3"><label class="form-label" for="unit_price">Custo unitário (R$) *</label><input
                class="form-control" type="number" id="unit_price" min="0" step="0.01" required></div>
            <div class="mb-3"><label class="form-label" for="notes">Observação</label><textarea class="form-control"
                id="notes" rows="3" placeholder="Ex.: nota fiscal, lote..."></textarea></div>
          </div>
          <div class="modal-footer"><button type="button" class="btn btn-light"
              data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary d-flex align-items-center gap-2"
              type="submit"><i data-feather="save"></i>Salvar Entrada</button></div>
        </form>
      </div>
    </div>
  </div>
  <div class="modal fade" id="movement-detail-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="movement-detail-title">Detalhes</h5><button class="btn-close"
            data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="movement-detail-content"></div>
        <div class="modal-footer"><button class="btn btn-light" data-bs-dismiss="modal">Fechar</button></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/movement-page.js"></script>
</body>

</html>
