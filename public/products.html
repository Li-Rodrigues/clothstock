<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ClothStock - Gestão de Produtos</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>

    <!-- Estilos de Layout (Claro / Escuro) -->
    <style>
        :root {
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --text-color: #212529;
            --border-color: #e2e8f0;
            --sidebar-bg: #1e293b;
        }

        body.dark-mode {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-color: #f8fafc;
            --border-color: #334155;
            --sidebar-bg: #0b0f19;
        }

        body { 
            display: flex; 
            min-height: 100vh; 
            background-color: var(--bg-body); 
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        .nxl-navigation { 
            width: 260px; 
            background: var(--sidebar-bg); 
            color: #fff; 
            flex-shrink: 0; 
            min-height: 100vh; 
            padding: 20px; 
            transition: background-color 0.3s;
        }

        .nxl-navigation a { 
            color: #94a3b8; 
            text-decoration: none; 
            padding: 10px 12px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            border-radius: 6px; 
        }

        .nxl-navigation a:hover, .nxl-navigation a.active { 
            color: #fff; 
            background: rgba(255,255,255,0.08); 
        }

        .nxl-container { flex-grow: 1; padding: 25px; }

        .nxl-header, .card { 
            background: var(--bg-card) !important; 
            color: var(--text-color) !important;
            border-color: var(--border-color) !important; 
            transition: background-color 0.3s;
        }

        .table {
            color: var(--text-color) !important;
        }

        body.dark-mode .table-light {
            background-color: #334155 !important;
            color: #f8fafc !important;
        }

        body.dark-mode .modal-content {
            background-color: #1e293b;
            color: #f8fafc;
            border-color: #334155;
        }

        body.dark-mode .form-control, body.dark-mode .form-select {
            background-color: #0f172a;
            color: #f8fafc;
            border-color: #334155;
        }
    </style>
</head>
<body>

    <!-- Sidebar / Menu de Navegação -->
    <nav class="nxl-navigation">
        <div class="m-header mb-4">
            <h4 class="text-white fw-bold mb-0">SGE</h4>
        </div>
        <ul class="nav flex-column gap-1">
            <li class="nav-item">
                <a href="/index.html"><i data-feather="layout"></i> <span>Dashboard</span></a>
            </li>
            <li class="nav-item">
                <a href="/categories.html"><i data-feather="folder"></i> <span>Categorias</span></a>
            </li>
            <li class="nav-item">
                <a href="/products.html" class="active"><i data-feather="box"></i> <span>Produtos</span></a>
            </li>
            <li class="nav-item">
                <a href="#"><i data-feather="database"></i> <span>Cálculos & Fichas</span></a>
            </li>
        </ul>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="nxl-container">
        <!-- Cabeçalho do Topo com Alternador Dark Mode -->
        <header class="nxl-header d-flex justify-content-between align-items-center shadow-sm p-3 mb-4 rounded">
            <div>
                <h5 class="mb-0 fw-bold">Gestão de Produtos</h5>
                <small class="text-muted">Controle de estoque, itens e quantidade a produzir</small>
            </div>
            <button id="theme-toggle" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-2" onclick="toggleDarkMode()">
                <i data-feather="moon" id="theme-icon"></i> <span id="theme-text">Modo Escuro</span>
            </button>
        </header>

        <!-- Corpo da Página -->
        <div class="main-content">
            <div id="alert-container"></div>

            <div class="card shadow-sm border">
                <div class="card-header bg-transparent d-flex justify-content-between align-items-center py-3">
                    <h5 class="card-title mb-0 fw-bold">Produtos Cadastrados</h5>
                    <button type="button" class="btn btn-primary btn-sm d-flex align-items-center gap-2" data-bs-toggle="modal" data-bs-target="#modalCreateProduct">
                        <i data-feather="plus"></i> Novo Produto
                    </button>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Categoria</th>
                                    <th>Preço</th>
                                    <th>Qtd. Estoque</th>
                                    <th>Qtd. a Produzir</th>
                                    <th class="text-end">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="products-table-body">
                                <tr>
                                    <td colspan="7" class="text-center text-muted py-4">Carregando produtos...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Modal Criar Produto -->
    <div class="modal fade" id="modalCreateProduct" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Novo Produto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-create-product">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nome do Produto</label>
                            <input type="text" class="form-control" id="create-product-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoria</label>
                            <select class="form-select" id="create-product-category" required>
                                <option value="">Selecione uma categoria...</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Preço (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="create-product-price" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Qtd. Estoque</label>
                                <input type="number" class="form-control" id="create-product-stock" value="0" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantidade a Produzir</label>
                            <input type="number" class="form-control" id="create-product-quantity-produced" value="0" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Salvar Produto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Editar Produto -->
    <div class="modal fade" id="modalEditProduct" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title fw-bold">Editar Produto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="form-edit-product">
                    <input type="hidden" id="edit-product-id">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Nome do Produto</label>
                            <input type="text" class="form-control" id="edit-product-name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Categoria</label>
                            <select class="form-select" id="edit-product-category" required>
                                <option value="">Selecione uma categoria...</option>
                            </select>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Preço (R$)</label>
                                <input type="number" step="0.01" class="form-control" id="edit-product-price" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Qtd. Estoque</label>
                                <input type="number" class="form-control" id="edit-product-stock" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Quantidade a Produzir</label>
                            <input type="number" class="form-control" id="edit-product-quantity-produced" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Atualizar Produto</button>
                    </div>
                </form>
            </div>
        </div>
    </div

    <!-- Scripts Bootstrap e Feather Icons -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 1. Inicialização de Ícones
        feather.replace();

        // 2. Lógica do Modo Escuro (Dark Mode)
        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            
            document.getElementById('theme-text').innerText = isDark ? 'Modo Claro' : 'Modo Escuro';
            
            const themeIcon = document.getElementById('theme-icon');
            themeIcon.setAttribute('data-feather', isDark ? 'sun' : 'moon');
            feather.replace();
        }

        // 3. API URLs
        const PRODUCTS_API_URL = '/api/products';
        const CATEGORIES_API_URL = '/api/categories';

        function showAlert(message, type = 'success') {
            const container = document.getElementById('alert-container');
            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        // Carregar categorias no Select dos Modais
        async function loadCategoriesSelect() {
            try {
                const response = await fetch(CATEGORIES_API_URL);
                const data = await response.json();
                const categoriesList = Array.isArray(data) ? data : (data.data || data.categories || []);

                const createSelect = document.getElementById('create-product-category');
                const editSelect = document.getElementById('edit-product-category');
                
                let options = '<option value="">Selecione uma categoria...</option>';
                categoriesList.forEach(cat => {
                    options += `<option value="${cat.id}">${cat.name || cat.nome}</option>`;
                });

                createSelect.innerHTML = options;
                editSelect.innerHTML = options;
            } catch (err) {
                console.error("Erro ao carregar categorias para os selects:", err);
            }
        }

        // Carregar Tabela de Produtos
        async function fetchProducts() {
    try {
        const response = await fetch(PRODUCTS_API_URL);
        const result = await response.json();
        
        // Se a API retornar { success: true, data: [...] }, extrai o array de result.data
        const productsList = Array.isArray(result) ? result : (result.data || []);

        const tbody = document.getElementById('products-table-body');
        tbody.innerHTML = '';

        if (!productsList || productsList.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">Nenhum produto cadastrado.</td></tr>';
            return;
        }

        productsList.forEach(prod => {
            const id = prod.id;
            const name = prod.name || prod.title || 'Sem nome';
            const categoryName = prod.category_name || '-';
            const categoryId = prod.category_id || '';
            const price = prod.price ?? 0;
            const stock = prod.stock_quantity ?? prod.quantity ?? 0;
            const quantityProduced = prod.quantity_produced ?? 0;

            tbody.innerHTML += `
                <tr>
                    <td>${id}</td>
                    <td class="fw-bold">${name}</td>
                    <td><span class="badge bg-light text-dark border">${categoryName}</span></td>
                    <td>R$ ${parseFloat(price).toFixed(2)}</td>
                    <td>${stock}</td>
                    <td><span class="badge bg-info text-dark">${quantityProduced}</span></td>
                    <td class="text-end">
                        <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal(${id}, '${name}', '${categoryId}', ${price}, ${stock}, ${quantityProduced})">Editar</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteProduct(${id})">Excluir</button>
                    </td>
                </tr>
            `;
        });
    } catch (error) {
        console.error("Erro ao buscar produtos:", error);
        document.getElementById('products-table-body').innerHTML = '<tr><td colspan="7" class="text-center text-danger py-4">Erro ao conectar com a API de produtos.</td></tr>';
    }
}

        // Criar Produto
        document.getElementById('form-create-product').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('create-product-name').value,
                category_id: document.getElementById('create-product-category').value,
                price: parseFloat(document.getElementById('create-product-price').value),
                stock_quantity: parseInt(document.getElementById('create-product-stock').value),
                quantity_produced: parseInt(document.getElementById('create-product-quantity-produced').value)
            };

            try {
                const response = await fetch(PRODUCTS_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    showAlert('Produto criado com sucesso!');
                    bootstrap.Modal.getInstance(document.getElementById('modalCreateProduct')).hide();
                    document.getElementById('form-create-product').reset();
                    fetchProducts();
                } else {
                    showAlert('Erro ao criar produto.', 'danger');
                }
            } catch (err) {
                showAlert('Erro ao conectar ao servidor.', 'danger');
            }
        });

        // Abrir Modal de Edição
        window.openEditModal = function(id, name, categoryId, price, stock, quantityProduced) {
            document.getElementById('edit-product-id').value = id;
            document.getElementById('edit-product-name').value = name;
            document.getElementById('edit-product-category').value = categoryId;
            document.getElementById('edit-product-price').value = price;
            document.getElementById('edit-product-stock').value = stock;
            document.getElementById('edit-product-quantity-produced').value = quantityProduced;
            
            new bootstrap.Modal(document.getElementById('modalEditProduct')).show();
        };

        // Editar Produto
        document.getElementById('form-edit-product').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('edit-product-id').value;
            const payload = {
                name: document.getElementById('edit-product-name').value,
                category_id: document.getElementById('edit-product-category').value,
                price: parseFloat(document.getElementById('edit-product-price').value),
                stock_quantity: parseInt(document.getElementById('edit-product-stock').value),
                quantity_produced: parseInt(document.getElementById('edit-product-quantity-produced').value)
            };

            try {
                const response = await fetch(`${PRODUCTS_API_URL}/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    showAlert('Produto atualizado com sucesso!');
                    bootstrap.Modal.getInstance(document.getElementById('modalEditProduct')).hide();
                    fetchProducts();
                } else {
                    showAlert('Erro ao atualizar produto.', 'danger');
                }
            } catch (err) {
                showAlert('Erro ao conectar ao servidor.', 'danger');
            }
        });

        // Excluir Produto
        window.deleteProduct = async function(id) {
            if (!confirm('Deseja realmente excluir este produto?')) return;

            try {
                const response = await fetch(`${PRODUCTS_API_URL}/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    showAlert('Produto excluído com sucesso!');
                    fetchProducts();
                } else {
                    showAlert('Erro ao excluir produto.', 'danger');
                }
            } catch (err) {
                showAlert('Erro de conexão.', 'danger');
            }
        };

        // Carregar dados iniciais
        document.addEventListener('DOMContentLoaded', () => {
            loadCategoriesSelect();
            fetchProducts();
        });
    </script>
</body>
</html>
